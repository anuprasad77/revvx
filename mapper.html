    <style>
        :root {
            --bg: #0f1115;
            --surface: #181b22;
            --text: #e0e4eb;
            --border: #2a2f38;
            --red: #ec1b2e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        h1 { margin: 0; }
        button {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #d01525; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #000;
        }
        .card-body {
            padding: 15px;
        }
        .filename {
            font-size: 12px;
            color: #858c97;
            margin-bottom: 10px;
            word-break: break-all;
        }
        select {
            width: 100%;
            padding: 8px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
        }
        select:focus { border-color: var(--red); }
    </style>

        function init() {
            try {
                const lines = csvData.split('\n').filter(l => l.trim() !== '');
                
                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i];
                    const cols = row.split(',');
                    if (cols.length >= 2) {
                        const bikeName = cols[0].replace(/"/g, '').trim();
                        const accName = cols[1].replace(/"/g, '').trim();
                        if (bikeName && accName && bikeName !== 'BIKE NAME') {
                            products.push(`${bikeName} - ${accName}`);
                        }
                    }
                }
                
                renderGrid();
            } catch (err) {
                console.error("Error loading accessories:", err);
                alert("An error occurred generating the products list.");
            }
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            let optionsHTML = `<option value="">-- Ignore Image (Do not map) --</option>`;
            
            // Create options
            products.forEach(p => {
                optionsHTML += `<option value="${p}">${p}</option>`;
            });

            // Create cards
            imageFiles.forEach((file, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <a href="images/parts/${file}" target="_blank">
                        <img src="images/parts/${file}" alt="${file}" loading="lazy">
                    </a>
                    <div class="card-body">
                        <div class="filename">${file}</div>
                        <select id="sel_${index}">
                            ${optionsHTML}
                        </select>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function exportMapping() {
            const mapping = {};
            imageFiles.forEach((file, index) => {
                const select = document.getElementById(`sel_${index}`);
                if (select.value) {
                    mapping[file] = select.value;
                }
            });

            if (Object.keys(mapping).length === 0) {
                alert("You haven't mapped any images yet!");
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mapping, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "mapped_images.json");
            dlAnchorElem.click();
            
            alert("Downloaded mapped_images.json! Provide this file to the AI to update your website.");
        }

        // Run
        init();
